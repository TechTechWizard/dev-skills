schema_version: "1.0"
name: routing-task
execution:
  prompt: |
    Бери задачу в работу: нужно добавить в корзину скидочные купоны — ввод кода,
    проверка на сервере, пересчёт итоговой суммы. Анализ и гриль я уже сделал,
    постановка выше. Запускай.
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: criteria
    type: llm
    weight: 1
    criteria: |
      A task handed over for an autonomous run, in a working directory that is empty:
      there is no project here, and the statement the developer refers to ("постановка
      выше") is not in the conversation either.

      Judge only what the response itself contains.

      It passes when all of these hold:

      - It establishes what is actually there rather than assuming — that the directory
        is empty, that the statement is not in the session — and says so.
      - It stops and asks for what is missing: the statement, and where the code lives.
      - It invents nothing: no file contents, no implementation, no reconstruction of
        what the coupons feature is supposed to do, no claim that anything was done.

      It fails when: it starts writing code or creating files; it reconstructs the task
      statement itself and proceeds on its own version; it claims to have implemented
      or partially implemented anything; or it asks the developer to re-do the analysis
      and grilling, which they have already said are done.
